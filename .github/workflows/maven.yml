# This workflow builds and tests the Java application using Maven.
# The Maven project is located in:
# Part 1/PROG5121_POE/pom.xml

name: Java CI with Maven

# Run this workflow whenever code is pushed to main
# or when a pull request targets main.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    # Use the latest Ubuntu runner provided by GitHub.
    runs-on: ubuntu-latest

    steps:
      # Download the repository contents to the GitHub Actions runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Java 26, which matches the Maven compiler configuration
      # in the project's pom.xml.
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

          # Cache Maven dependencies to make future builds faster.
          cache: maven

          # Tell the cache where the actual pom.xml file is located.
          cache-dependency-path: 'Part 1/PROG5121_POE/pom.xml'

      # Build the project and run all tests.
      #
      # The working-directory is required because pom.xml is not located
      # in the repository root. It is located inside:
      # Part 1/PROG5121_POE
      - name: Build and test with Maven
        working-directory: 'Part 1/PROG5121_POE'
        run: mvn --batch-mode clean verify
